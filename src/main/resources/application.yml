server:
  port: 8081

spring:
  application:
    name: paperless-rest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${DB_USER:paperless}
    password: ${DB_PASSWORD:paperless_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASSWORD:paperless_dev}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: true
        prefetch: 1
        missing-queues-fatal: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:21MB}

storage:
  endpoint: ${S3_ENDPOINT:http://localhost:19000}
  access-key: ${S3_ACCESS_KEY:paperless_storage}
  secret-key: ${S3_SECRET_KEY:paperless_storage_dev}
  bucket: ${S3_BUCKET:documents}

search:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}

logging:
  structured:
    format:
      console: logstash

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
