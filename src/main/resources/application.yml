server:
  port: 8081

spring:
  application:
    name: paperless-rest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${DB_USER:paperless}
    password: ${DB_PASSWORD:paperless_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASSWORD:paperless_dev}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true

jobs:
  poll-ms: ${JOB_POLL_MS:3000}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info
