services:
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless_dev}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rest:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-paperless}
      DB_USER: ${POSTGRES_USER:-paperless}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-paperless_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless_dev}
      UPLOAD_DIRECTORY: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./frontend
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      rest:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:
