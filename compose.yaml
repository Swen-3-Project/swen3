services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-paperless_storage}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-paperless_storage_dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless_dev}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rest:
    build: .
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-paperless}
      DB_USER: ${POSTGRES_USER:-paperless}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-paperless_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless_dev}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-paperless_storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-paperless_storage_dev}
      S3_BUCKET: documents
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  ui:
    build: ./frontend
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      rest:
        condition: service_started

  ocr-worker:
    build: ./ocr-worker
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-paperless_storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-paperless_storage_dev}
      S3_BUCKET: documents
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1536m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 24

  indexing-worker:
    build: ./indexing-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless_dev}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  rustfs_data:
  elasticsearch_data:
