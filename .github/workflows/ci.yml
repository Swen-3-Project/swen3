name: Project CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run e2e:typecheck
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -f ocr-worker/pom.xml verify
  integration:
    runs-on: ubuntu-latest
    needs: [verify, frontend, worker]
    env:
      UI_PORT: '8080'
      PAPERLESS_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: python3 tests/sprint3_integration.py --url "$PAPERLESS_URL"
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
