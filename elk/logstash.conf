input {
  file {
    path => "/app-logs/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/paperless.sincedb"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
    data_stream => false
  }
}
